[package]
name = "traceseal-core"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "traceseal-core"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.1", features = ["multipart"] }
bincode = "1.3.3"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
futures = "0.3.32"
hex = "0.4.3"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http1", "tokio"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
rustls = { version = "0.23.40", features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_json_canonicalizer = "=0.4.1"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.18"
tlsn = { git = "https://github.com/tlsnotary/tlsn.git", tag = "v0.1.0-alpha.15" }
tlsn-formats = { git = "https://github.com/tlsnotary/tlsn.git", tag = "v0.1.0-alpha.15" }
tokio = { version = "1.52.3", features = ["full"] }
tokio-rustls = "0.26.4"
tokio-util = { version = "0.7.18", features = ["compat", "io"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.2", features = ["cors", "trace", "limit"] }
url = "2.5.8"
